<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7cc7ff"><title>Cute Dart 🎯</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="topbar"><div class="brand"><span class="brand-ball">🎯</span><div><strong>Cute Dart</strong><small>今日也來丟一鏢吧！</small></div></div><button id="soundBtn" class="icon-btn">🔊</button></header><section id="homeScreen" class="screen active"><div class="hero-card"><div class="mascot">🐾</div><div class="sparkles">✦ ✨ ✦</div><h1>可愛飛鏢小挑戰！</h1><p>經典模式或開鏡頭，把房間變成飛鏢場 🎯</p></div><div class="play-style-grid"><button id="classicEntry" class="play-style-card"><span>🎯</span><b>A 經典飛鏢</b><small>原本玩法，手指拖曳投擲</small></button><button id="cameraEntry" class="play-style-card camera-entry"><span>📷</span><b>B Camera 飛鏢</b><small>相機實景＋虛擬飛鏢靶</small></button></div><div id="classicModes" class="mode-panel"><div class="mode-grid"><button class="mode-card" data-mode="501"><span>🎯</span><b>501</b><small>經典對戰</small></button><button class="mode-card" data-mode="301"><span>⭐</span><b>301</b><small>快速一局</small></button><button class="mode-card" data-mode="practice"><span>🌈</span><b>練習模式</b><small>隨便丟、沒有壓力</small></button></div></div><div class="record-card"><div><span>🏆 最高單回合</span><b id="bestRoundHome">0</b></div><div><span>🔥 180 次數</span><b id="oneEightyHome">0</b></div></div></section><section id="gameScreen" class="screen"><div class="score-row"><div><small id="modeLabel">501</small><strong id="score">501</strong><span>剩餘分數</span></div><div class="turn-box"><small>本回合</small><strong id="turnScore">0</strong><span id="dartCount">0 / 3 鏢</span></div></div><div class="board-wrap"><canvas id="board" width="420" height="420"></canvas><div id="hitBadge" class="hit-badge"></div></div><div class="hint" id="hint">👆 按住靶面，往外拉再放開！</div><div class="last-throw" id="lastThrow">準備好了嗎？</div><div class="game-actions"><button id="endTurnBtn" class="secondary-btn" disabled>結束回合</button><button id="restartBtn" class="secondary-btn">重新開始</button></div></section><section id="cameraScreen" class="screen camera-screen"><div class="camera-stage" id="cameraStage"><video id="cameraVideo" autoplay muted playsinline></video><canvas id="handOverlay" class="hand-overlay"></canvas><div class="throw-zone"><span>投擲區</span></div><div id="gestureBig" class="gesture-big">🖐️ 準備</div><div id="cameraFallback" class="camera-fallback"><span>📷</span><b>等待相機畫面</b><small>請允許瀏覽器使用前鏡頭</small></div><div id="arBoard" class="ar-board"><canvas id="cameraBoard" width="420" height="420"></canvas><div id="cameraHitBadge" class="hit-badge"></div></div><div class="camera-hud"><span id="cameraScore">練習 0 分</span><span id="cameraDarts">0 / 3 鏢</span></div></div><div class="camera-tools"><button id="flipCamera" class="tool-btn">🔄 切換鏡頭</button><button id="smallerBoard" class="tool-btn">➖ 靶縮小</button><button id="biggerBoard" class="tool-btn">➕ 靶放大</button><button id="resetBoard" class="tool-btn">🎯 置中</button></div><div class="gesture-status"><b id="gestureState">🖐️ 尚未啟動手勢追蹤</b><small id="gestureDetail">相機開啟後，系統會尋找你的投鏢手</small></div><div id="cameraHint" class="hint">先開啟相機，再拖曳飛鏢靶到想放的位置</div><button id="openCameraBtn" class="secondary-btn" style="width:100%;margin:0 0 10px">📷 開啟相機</button><div class="game-actions"><button id="cameraThrowMode" class="primary-btn">開始體感投鏢 🎯</button><button id="cameraHomeBtn" class="secondary-btn">回首頁</button></div></section><section id="resultScreen" class="screen"><div class="result-card"><div class="result-mascot">🐾✨</div><h2 id="resultTitle">太棒啦！</h2><p id="resultSub">這一局完成！</p><div class="result-stats"><div><span>總鏢數</span><b id="finalDarts">0</b></div><div><span>最佳回合</span><b id="finalBest">0</b></div><div><span>180 次數</span><b id="final180">0</b></div></div><button id="againBtn" class="primary-btn">再來一局 🎯</button><button id="homeBtn" class="secondary-btn">回首頁</button></div></section></main><script src="game.js?v=20261006-b6"></script><script type="module" src="gesture.js?v=20261006-b8"></script></body></html>
